name: Weekly content update

# Once a week, looks for new students (SchaleDB's JP and Global), voice
# lines, halos and songs (the Blue Archive wiki's Music page), without
# building anything (scripts/find-updates.mjs). When there are some, it
# builds them in with the same scripts as `npm run students`, adds the songs
# (scripts/build-new-songs.mjs), runs the full check, puts the new files on
# the Worker and R2 as `npm run songs` does, and opens a pull request to
# review and merge. It never pushes to main: merging is what deploys.
#
# Needs the CLOUDFLARE_API_TOKEN secret with Workers Scripts and Workers R2
# Storage edit rights, CLOUDFLARE_ACCOUNT_ID, and Settings > Actions >
# General > "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    # Wednesdays, a day after the game's Tuesday updates, once SchaleDB and
    # the wiki have caught up.
    - cron: "0 12 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content-update
  cancel-in-progress: false

env:
  UPDATE_SUMMARY: /tmp/update-summary.md

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # UnityPy, which unpacks the game's pictures (scripts/requirements.txt,
      # pinned with the libraries that decode them).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # What's been downloaded, unpacked or measured before, so it isn't
      # again: the game's music (about 435 MB; BA-AD skips media it has), the
      # pictures unpacked from the game, SchaleDB's icons and voice tones.
      # Not BA-AD's asset bundles, which it downloads again every run anyway.
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            !.cache/baad-ui
            !.cache/baad-sprites
            !.cache/baad-models
          key: content-cache-${{ github.run_id }}
          restore-keys: content-cache-

      # BA-AD (https://github.com/Deathemonic/BA-AD), which downloads the
      # game's files from JP's servers, and BA-AX
      # (https://github.com/Deathemonic/BA-AX), which opens its voice zips:
      # each pinned to one release and checked against its SHA-256, so a new
      # release can't change this Action unseen. The scripts find them by
      # BAAD and BAAX.
      - name: Install BA-AD and BA-AX
        env:
          BAAD_URL: https://github.com/Deathemonic/BA-AD/releases/download/v3.1.0/baad-linux-x86_64.zip
          BAAD_SHA256: e1550a45bf21a53f5cc45ad626107073d4288f983e76d76a3ac637347fbbfe4b
          BAAX_URL: https://github.com/Deathemonic/BA-AX/releases/download/v3.0.0/baax-linux-x86_64.zip
          BAAX_SHA256: f9fa335d65075815d3e89665aee6ab14055e3a5f29c1983bce4148a2f0091228
        run: |
          for tool in baad baax; do
            url_var="${tool^^}_URL"; sum_var="${tool^^}_SHA256"
            curl -sSfL -o "$RUNNER_TEMP/$tool.zip" "${!url_var}"
            echo "${!sum_var}  $RUNNER_TEMP/$tool.zip" | sha256sum -c -
            unzip -o -q "$RUNNER_TEMP/$tool.zip" -d "$RUNNER_TEMP/$tool"
            chmod +x "$RUNNER_TEMP/$tool/$tool"
            echo "${tool^^}=$RUNNER_TEMP/$tool/$tool" >> "$GITHUB_ENV"
          done

      # The game's music. If it fails (the game in maintenance, say), the
      # download kept from before and the wiki are used this week.
      - name: Download the game's music
        continue-on-error: true
        run: npm run download:music

      - name: Look for anything new
        id: find
        run: |
          printf 'The weekly content update found:\n\n' > "$UPDATE_SUMMARY"
          node scripts/find-updates.mjs

      - name: Build it in
        if: steps.find.outputs.changed == 'true'
        run: |
          npm run build:students
          npm run build:voices
          npm run build:guess
          node scripts/build-new-songs.mjs
          npx prettier --write src/constants/songs.ts
          npm run build:daily-order
          npm run build:audio
          npm run build:voice-audio
          npm run build:pictures

      - name: See whether anything changed
        if: steps.find.outputs.changed == 'true'
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi
          git reset -q

      - name: Check it
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run check:audio
          npm run check:pictures
          npm run build

      - name: Put the new files on the Worker and R2
        if: steps.diff.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run upload:audio
          npm run upload:backup
          node scripts/check-audio.mjs --remote
          node scripts/check-pictures.mjs --remote

      # Now the new pictures are on the Worker, go through every page on
      # both servers in Chrome, as a player would. A failure stops here, with
      # no pull request; the screenshots are attached to the run.
      - name: Check the pages in a browser
        if: steps.diff.outputs.changed == 'true'
        run: npm run check:pages

      - name: Keep the screenshots of what broke
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-pages
          path: check-pages-output/
          if-no-files-found: ignore

      - name: Say so in the pull request
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            echo
            echo "The new files are on the Worker and R2 already, and the full"
            echo "check passed, pages in Chrome included. Merging this deploys"
            echo "it. Check new songs' names first: the wiki writes some"
            echo "differently from the list."
          } >> "$UPDATE_SUMMARY"

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/content-update
          delete-branch: true
          commit-message: "chore: add this week's students, voices, pictures and songs"
          title: "Weekly content update"
          body-path: ${{ env.UPDATE_SUMMARY }}
