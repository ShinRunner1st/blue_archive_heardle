name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Check every song has its audio file
        run: npm run check:audio

      - name: Check every picture is built
        run: npm run check:pictures

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Every page on both servers in Chrome (the runner has it), with the
      # pictures from the Worker, so a sheet must be uploaded before its
      # pull request (npm run songs).
      - name: Check the pages in a browser
        run: npm run check:pages

      # The site goes live only from main, and only once everything above has
      # passed. Uses the same secrets as the Now in Global Action. The
      # accounts go first: their database's migrations (only ever adding),
      # after printing its Time Travel bookmark to go back to, then the
      # Worker, so a new page never meets an older API. The rooms next: they
      # deal the songs and voices the new site knows, and a page older than
      # the rooms is asked to reload.
      - name: Deploy the accounts to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run deploy:accounts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the multiplayer rooms to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run deploy:rooms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the site to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run deploy:site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Keep the screenshots of what broke
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-pages
          path: check-pages-output/
          if-no-files-found: ignore
