<!DOCTYPE html>
<!--
  The link previews, public/preview.jpg for the hub and public/previews/
  for each other page: drawn by scripts/make-preview.mjs, which serves this
  page with Vite at ?page=<page> and screenshots it at 1200x630. preview.ts
  fills in the page's words and cards. Never part of the site's build. No
  counts of songs or students: they grow, and a picture that sites keep a
  copy of would soon be out of date.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./preview.css" />
  </head>
  <body>
    <main class="card">
      <div class="ring ring-a"></div>
      <div class="ring ring-b"></div>
      <div class="band"></div>

      <section class="text">
        <img class="logo" src="/src/image/BlueArchive-Heardle.png" alt="" />
        <p class="tagline"></p>
        <ul class="games"></ul>
        <p class="footer"></p>
      </section>

      <div class="sparks"></div>
      <div class="character"><canvas></canvas></div>
      <p class="site"></p>
    </main>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
