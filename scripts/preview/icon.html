<!DOCTYPE html>
<!--
  The site's icon: Mari (Idol), flustered (expression 11), on the charcoal
  of her dress, drawn with the Spine runtime like the preview. Drawn by
  scripts/make-preview.mjs at 512 pixels and scaled down from there into
  favicon.ico, logo192.png and logo512.png. With ?bleed the tile fills the
  square, for apple-touch-icon.png: iOS rounds the corners itself.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 512px;
        height: 512px;
        overflow: hidden;
        background: transparent;
      }
      .tile {
        position: relative;
        width: 512px;
        height: 512px;
        overflow: hidden;
        border-radius: 112px;
        background: linear-gradient(180deg, #3f3846, #1d1a21);
      }
      .bleed .tile {
        border-radius: 0;
      }
      canvas {
        position: absolute;
      }
    </style>
  </head>
  <body>
    <div class="tile"><canvas></canvas></div>
    <script type="module">
      import { FRAME, spineCharacters } from "/src/constants/characters.ts";
      import { createStage } from "/src/helpers/spineStage.ts";

      if (location.search.includes("bleed")) {
        document.body.classList.add("bleed");
      }

      /** Pixels to a skeleton unit: her face fills the tile. */
      const ZOOM = 1.15;
      /** How far below the tile's middle her eyes sit, in pixels. */
      const EYES_BELOW = -6;

      const canvas = document.querySelector("canvas");
      Object.assign(canvas.style, {
        width: `${FRAME.width * ZOOM}px`,
        height: `${FRAME.height * ZOOM}px`,
        left: `${256 - (FRAME.width / 2) * ZOOM}px`,
        top: `${256 - FRAME.aboveEyes * ZOOM + EYES_BELOW}px`,
      });
      const stage = createStage(canvas);
      // A few frames for the expression to settle before the screenshot.
      stage.onReady(() => setTimeout(() => (window.previewReady = true), 600));
      stage.setExpression("11");
      stage.show(spineCharacters.mari);
    </script>
  </body>
</html>
