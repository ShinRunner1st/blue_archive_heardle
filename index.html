<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo192.png" />
    <link rel="apple-touch-icon" href="/logo192.png" />

    <!--
      Playback pulls from three YouTube origins: the API script and the player
      iframe from www.youtube.com, the widget JS from s.ytimg.com and the
      poster image from i.ytimg.com. None is requested until React mounts a
      player, so without these hints each one pays for a fresh DNS lookup and
      TLS handshake at exactly the moment the player is needed.

      The API script itself is not preloaded: it is under 1 KB and is served
      `Cache-Control: private, max-age=0`, so a preload would risk fetching it
      twice for almost no gain.
    -->
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://s.ytimg.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="dns-prefetch" href="https://www.youtube.com" />
    <link rel="dns-prefetch" href="https://s.ytimg.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme -->
    <meta name="theme-color" content="#38220f" />

    <!-- ========================= -->
    <!-- SEO -->
    <!-- ========================= -->

    <title>Blue Archive Heardle - Guess the Blue Archive OST</title>

    <meta
      name="description"
      content="Play Blue Archive Heardle, a music guessing game where you listen to short audio clips and guess ost from the Blue Archive."
    />

    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://bluearchive-heardle.xyz/" />

    <!-- ========================= -->
    <!-- Web App Manifest -->
    <!-- ========================= -->

    <link rel="manifest" href="/manifest.json" />

    <!-- ========================= -->
    <!-- Open Graph -->
    <!-- For Discord, Facebook, LINE, etc. -->
    <!-- ========================= -->

    <meta
      property="og:title"
      content="Blue Archive Heardle - Guess the Blue Archive OST"
    />

    <meta
      property="og:description"
      content="Play Blue Archive Heardle and guess Blue Archive OST tracks from short audio clips."
    />

    <meta
      property="og:image"
      content="https://bluearchive-heardle.xyz/preview.jpg"
    />

    <meta property="og:url" content="https://bluearchive-heardle.xyz/" />

    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="Blue Archive Heardle" />

    <meta property="og:locale" content="en_US" />

    <!-- ========================= -->
    <!-- Twitter / X -->
    <!-- ========================= -->

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Blue Archive Heardle - Guess the Blue Archive OST"
    />

    <meta
      name="twitter:description"
      content="Listen to short audio clips and guess Blue Archive OST tracks."
    />

    <meta
      name="twitter:image"
      content="https://bluearchive-heardle.xyz/preview.jpg"
    />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>

    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
