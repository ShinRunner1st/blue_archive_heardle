<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicon (drawn by scripts/make-preview.mjs) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme -->
    <meta name="theme-color" content="#38220f" />

    <!-- ========================= -->
    <!-- SEO -->
    <!-- The fields in double braces are filled in for each page, the hub -->
    <!-- and a page per game, from src/constants/pages.ts (vite.config.ts). -->
    <!-- ========================= -->

    <title>{{page.title}}</title>

    <meta name="description" content="{{page.description}}" />

    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="{{page.url}}" />

    <!-- ========================= -->
    <!-- Web App Manifest -->
    <!-- ========================= -->

    <link rel="manifest" href="/manifest.json" />

    <!-- ========================= -->
    <!-- Open Graph -->
    <!-- For Discord, Facebook, LINE, etc. -->
    <!-- ========================= -->

    <meta property="og:title" content="{{page.title}}" />

    <meta property="og:description" content="{{page.description}}" />

    <meta property="og:image" content="{{page.preview}}" />

    <meta property="og:image:width" content="1200" />

    <meta property="og:image:height" content="630" />

    <meta property="og:image:alt" content="{{page.previewAlt}}" />

    <meta property="og:url" content="{{page.url}}" />

    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="Blue Archive Heardle" />

    <meta property="og:locale" content="en_US" />

    <!-- ========================= -->
    <!-- Twitter / X -->
    <!-- ========================= -->

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="{{page.title}}" />

    <meta name="twitter:description" content="{{page.description}}" />

    <meta name="twitter:image" content="{{page.preview}}" />

    <meta name="twitter:image:alt" content="{{page.previewAlt}}" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>

    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
