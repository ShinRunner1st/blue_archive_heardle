<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="%PUBLIC_URL%/logo192.png"
    />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme -->
    <meta name="theme-color" content="#000000" />

    <!-- ========================= -->
    <!-- SEO -->
    <!-- ========================= -->

    <title>Blue Archive Heardle - Guess the Blue Archive OST</title>

    <meta
      name="description"
      content="Play Blue Archive Heardle, a music guessing game where you listen to short audio clips and guess ost from the Blue Archive."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://bluearchive-heardle.xyz/"
    />

    <!-- ========================= -->
    <!-- Web App Manifest -->
    <!-- ========================= -->

    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- ========================= -->
    <!-- Open Graph -->
    <!-- For Discord, Facebook, LINE, etc. -->
    <!-- ========================= -->

    <meta
      property="og:title"
      content="Blue Archive Heardle - Guess the Blue Archive OST"
    />

    <meta
      property="og:description"
      content="Play Blue Archive Heardle and guess Blue Archive OST tracks from short audio clips."
    />

    <meta
      property="og:image"
      content="https://bluearchive-heardle.xyz/preview.png"
    />

    <meta
      property="og:url"
      content="https://bluearchive-heardle.xyz/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Blue Archive Heardle"
    />

    <meta
      property="og:locale"
      content="en_US"
    />

    <!-- ========================= -->
    <!-- Twitter / X -->
    <!-- ========================= -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Blue Archive Heardle - Guess the Blue Archive OST"
    />

    <meta
      name="twitter:description"
      content="Listen to short audio clips and guess Blue Archive OST tracks."
    />

    <meta
      name="twitter:image"
      content="https://bluearchive-heardle.xyz/preview.png"
    />
